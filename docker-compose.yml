# Large team deployment: PostgreSQL + Gunicorn + Nginx
# Suitable for 20+ users, >10,000 SMS/day

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: sms-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sms_platform
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sms_secure_password_2024}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_user -d sms_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # Flask Application with Gunicorn
  app:
    build: .
    container_name: sms-platform-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DEPLOY_RUN_PORT=5000
      - FLASK_ENV=production
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change_me_in_production_use_random_hex}
      - DATABASE_URL=postgresql://sms_user:${DB_PASSWORD:-sms_secure_password_2024}@db:5432/sms_platform
      - APP_ENVIRONMENT=${APP_ENVIRONMENT:-production}
      - APP_LABEL=${APP_LABEL:-}
      # Gunicorn worker count. Production defaults to 2*CPU+1 inside the image.
      # Override on small test servers (e.g. GUNICORN_WORKERS=2) to save memory.
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-}
      # Base public URL for payment short links (e.g. https://test.pagoserve.com).
      # Falls back to the request host when empty.
      - SHORT_LINK_BASE_URL=${SHORT_LINK_BASE_URL:-}
    volumes:
      - app-logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # Asterisk WebRTC <-> VOS3000 gateway (softphone at /static/phone)
  asterisk:
    build: ./asterisk
    container_name: sms-platform-asterisk
    restart: unless-stopped
    environment:
      - HTTP_PORT=8089
      - RTP_START=10000
      - RTP_END=10100
      - STUN_SERVER=${STUN_SERVER:-stun.l.google.com:19302}
      - EXTERNAL_IP=${PHONE_EXTERNAL_IP:-47.87.38.52}
      - LOCAL_NET=${PHONE_LOCAL_NET:-172.16.0.0/12}
      - TRUNK_HOST=${VOS3000_HOST:-43.112.27.24}
      - TRUNK_PORT=${VOS3000_PORT:-5060}
      # Provider dial prefix: 52 / 0052 / empty (confirm with the line vendor)
      - OUTBOUND_PREFIX=${VOS3000_PREFIX:-}
      # Shared initial secret for the 1001-1020 web peers (set in .env)
      - PEER_SECRET=${PHONE_PEER_SECRET:-}
    volumes:
      - asterisk-certs:/var/lib/asterisk/phone-certs
    ports:
      # Browser <-> Asterisk media (published; opened in the cloud firewall)
      - "10000-10100:10000-10100/udp"
      # SIP trunk signaling/media toward VOS3000 (outbound + inbound RTP)
      - "5060:5060/udp"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sms-platform-nginx
    restart: unless-stopped
    depends_on:
      - app
      - asterisk
    environment:
      # Public domain served by nginx (used for server_name + cert paths).
      # Test: test.pagoserve.com  |  Production: pagoserve.com
      - DOMAIN=${DOMAIN:-localhost}
      # Limit envsubst so it only replaces ${DOMAIN}, not nginx's own $host,
      # $scheme, $binary_remote_addr, $proxy_add_x_forwarded_for, etc.
      # "$$" is Compose escaping for a literal "$" (works on both Compose v1 and v2);
      # the container receives NGINX_ENVSUBST_FILTER=^DOMAIN$
      - NGINX_ENVSUBST_FILTER=^DOMAIN$$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Template rendered at startup with envsubst -> /etc/nginx/conf.d/default.conf
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./static:/app/static:ro
      # Host-mounted download folder: drop APK/files in nginx/downloads on the
      # host, served publicly at https://DOMAIN/downloads/<file> (no rebuild)
      - ./nginx/downloads:/usr/share/nginx/downloads:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

volumes:
  postgres-data:
    driver: local
  app-logs:
    driver: local
  asterisk-certs:
    driver: local
