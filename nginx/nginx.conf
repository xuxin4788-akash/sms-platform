# Nginx reverse proxy for SMS Marketing Platform
# - TLS (HTTPS) via Let's Encrypt for test.pagoserve.com
# - Serves static files directly (CSS/JS)
# - Proxies API and the short-link redirects (/l/<code>) to the Flask app
# - ACME http-01 challenge served from a shared webroot for certificate renewal

# Rate limiting zone (http context; applied per location)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

upstream app_server {
    server app:5000;
}

# HTTP (port 80): serve ACME challenges, redirect everything else to HTTPS
server {
    listen 80;
    server_name test.pagoserve.com;

    # Let's Encrypt http-01 challenge (renewal while nginx is running)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (port 443)
server {
    listen 443 ssl;
    http2 on;
    server_name test.pagoserve.com;

    # Let's Encrypt certificates (mounted from /etc/letsencrypt on the host)
    ssl_certificate     /etc/letsencrypt/live/test.pagoserve.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.pagoserve.com/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Client upload limit (CSV contacts imports, contact database)
    client_max_body_size 20m;

    # Static files served directly by nginx
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Short-link redirects must reach the Flask app (do not treat as static)
    location /l/ {
        proxy_pass http://app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth endpoints: stricter rate limiting
    location ~ ^/api/auth/(login|logout) {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other requests (API + the SPA index) go to Flask
    location / {
        proxy_pass http://app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}
