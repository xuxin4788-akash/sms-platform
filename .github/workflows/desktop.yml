name: Build Desktop Client

on:
  push:
    tags:
      - 'desktop-v*'
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder: win
            artifact_name: sms-plataforma-win
          - os: macos-latest
            builder: mac
            artifact_name: sms-plataforma-mac
          - os: ubuntu-latest
            builder: linux
            artifact_name: sms-plataforma-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci || npm install

      - name: Build Electron app
        working-directory: desktop
        shell: bash
        run: npx electron-builder --${{ matrix.builder }} --x64 --publish never

      - name: List build output
        working-directory: desktop
        shell: bash
        run: |
          echo "--- dist directory ---"
          ls -la dist/ || { echo "ERROR: dist/ does not exist"; exit 1; }
          echo "--- installer files ---"
          find dist -maxdepth 2 -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.zip" -o -name "*.blockmap" -o -name "*.yml" \) -print

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/*.yml
          if-no-files-found: error
          retention-days: 30
