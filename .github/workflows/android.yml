name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL the app loads (e.g. https://pagoserve.com)'
        required: false
        default: 'https://pagoserve.com'
      build_type:
        description: 'Build variant'
        required: false
        type: choice
        default: 'release'
        options:
          - release
          - debug
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'templates/**'
      - 'static/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMS_SERVER_URL: ${{ github.event.inputs.server_url || 'https://pagoserve.com' }}
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
      # secrets context is NOT allowed inside if:; expose presence as an env flag.
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile=false

      # Point Capacitor at the chosen server and bundle the latest web assets.
      - name: Sync web assets + Capacitor config
        working-directory: mobile
        run: |
          node scripts/sync-web.js
          node scripts/write-capacitor-config.js

      - name: Add Android platform
        working-directory: mobile
        run: pnpm run add:android || true

      - name: Sync Capacitor (plugins + config)
        working-directory: mobile
        run: pnpm exec cap sync android

      # Must run AFTER cap sync (which rewrites the manifest) so our custom
      # <queries>/cleartext edits are preserved for the build.
      - name: Patch Android manifest
        working-directory: mobile
        run: python3 scripts/patch-android.py

      - name: Resolve signing keystore
        if: ${{ env.BUILD_TYPE == 'release' && env.HAS_SIGNING == 'true' }}
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > sms-marketing-release.keystore
          echo "keystore bytes: $(wc -c < sms-marketing-release.keystore)"

      - name: Build signed release APK
        if: ${{ env.BUILD_TYPE == 'release' && env.HAS_SIGNING == 'true' }}
        working-directory: mobile/android
        env:
          KEYSTORE_FILE: sms-marketing-release.keystore
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'sms-marketing' }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK (no signing secrets)
        if: ${{ env.BUILD_TYPE == 'debug' || env.HAS_SIGNING != 'true' }}
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify release signature
        if: ${{ env.BUILD_TYPE == 'release' && env.HAS_SIGNING == 'true' }}
        working-directory: mobile/android
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -5

      - name: Show embedded server URL
        run: |
          if [ -f mobile/android/app/src/main/assets/capacitor.config.json ]; then
            grep -o '"url":[^,]*' mobile/android/app/src/main/assets/capacitor.config.json
          fi

      - name: Upload release APK
        if: ${{ env.BUILD_TYPE == 'release' && env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sms-marketing-android-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 60

      - name: Upload debug APK
        if: ${{ env.BUILD_TYPE == 'debug' || env.HAS_SIGNING != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sms-marketing-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
