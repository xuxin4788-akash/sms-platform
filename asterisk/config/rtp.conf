; RTP engine for the WebRTC <-> trunk bridge.
; Ports are published on the host (docker-compose) and opened in the firewall.
[general]
rtpstart=__RTP_START__
rtpend=__RTP_END__
; Drop packets from sources we never sent to (basic RTP hijack protection).
icesupport=yes
stunaddr=__STUN_SERVER__
strictrtp=yes
; Browser <-> Asterisk uses SRTP/DTLS; Asterisk <-> VOS3000 uses plain RTP.
