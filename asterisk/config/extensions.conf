; Dialplan for the WebRTC softphone gateway.

[from-internal]
; Echo test / self check: dial 7777
exten => 7777,1,NoOp(Echo test for ${CALLERID(num)})
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Anything else is an outbound call through the VOS3000 trunk.
exten => _X.,1,NoOp(Outbound ${CALLERID(num)} -> ${EXTEN})
 same => n,Goto(outbound,${EXTEN},1)

exten => _+X.,1,NoOp(Outbound E.164 ${CALLERID(num)} -> ${EXTEN})
 same => n,Goto(outbound,${EXTEN},1)

[outbound]
exten => _X.,1,NoOp(Normalize destination)
; Strip a leading + and any 00 international prefix.
 same => n,Set(raw=${EXTEN})
 same => n,Set(num=${FILTER(0-9,${raw})})
; Apply the provider dial prefix (52 / 0052 / empty) configured at deploy.
 same => n,Set(dest=__OUTBOUND_PREFIX__${num})
 same => n,Verbose(2,Dialing PJSIP/trunk-vos3000/${dest})
 same => n,Dial(PJSIP/${dest}@trunk-vos3000,60,g)
 same => n,Hangup(${HANGUPCAUSE})

; Inbound calls from the trunk. No DIDs are mapped yet, so answer with a
; brief Spanish prompt and end. Map real DIDs here when the provider issues them.
[from-trunk]
exten => _X.,1,NoOp(Inbound from trunk ${EXTEN})
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()
