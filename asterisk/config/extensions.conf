; Dialplan for the WebRTC softphone gateway.

[from-internal]
; Echo test / self check: dial 7777
exten => 7777,1,NoOp(Echo test for ${CALLERID(num)})
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; One-way playback test (Asterisk -> browser only, no mic/loop involved): 7778
exten => 7778,1,NoOp(Playback-only test for ${CALLERID(num)})
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()

; Anything else is an outbound call through the VOS3000 trunk.
exten => _X.,1,NoOp(Outbound ${CALLERID(num)} -> ${EXTEN})
 same => n,Goto(outbound,${EXTEN},1)

exten => _+X.,1,NoOp(Outbound E.164 ${CALLERID(num)} -> ${EXTEN})
 same => n,Goto(outbound,${EXTEN},1)

[outbound]
; Both plain digits and E.164 (+52...) targets go through normalization.
; Priority labels are explicit on every line: do NOT use shared "same => n,"
; continuations across the _X. / _+X. entries, or Asterisk attaches the whole
; chain to the LAST matching entry and the other pattern is left dangling
; (call hits that one, runs only priority 1 and fallthroughs without dialing).
exten => _X.,1,Goto(normalize,${EXTEN},1)
exten => _+X.,1,Goto(normalize,${EXTEN},1)

[normalize]
; Each of the two destination patterns (_X. plain digits, _+X. E.164) gets its
; OWN complete, explicitly-numbered chain.  Number 5526057993 (52 prefix, 10
; digits) matches _X. and must still run Set/FILTER/ExecIf/Dial.
exten => _X.,1,NoOp(Normalize destination: ${EXTEN})
exten => _X.,2,Set(num=${FILTER(0-9,${EXTEN})})
exten => _X.,3,Set(local=${num})
; If the number carries the Mexico country code (starts with 52 and is longer
; than the 10-digit national number), strip the leading 52. Contacts stored as
; E.164 (+52XXXXXXXXXX) arrive as 52XXXXXXXXXX -> XXXXXXXXXX.
; Uses SUBSTR string compare, NOT REGEX(): the Ubuntu 24.04 Asterisk REGEX()
; arg parser is fragile and logs "Unexpected arguments" on typical forms.
exten => _X.,4,ExecIf($[ "${SUBSTR(${num},1,2)}" = "52" & ${LEN(num)}>10 ]?Set(local=${num:2}))
; Legacy mobile format used a leading 1 after the country code (+521XXXXXXXXXX):
; if an 11-digit number starting with 1 remains, drop that 1 as well.
exten => _X.,5,ExecIf($[ "${SUBSTR(${local},1,1)}" = "1" & ${LEN(local)}=11 ]?Set(local=${local:1}))
; Normalize both pattern chains, then hand off to the SAME shared routing
; contexts [out1] (trunk-vos3000) / [out2] (trunk-lan2). The providers'
; respective outbound prefixes are applied inside those contexts.
exten => _X.,6,NoOp(Normalized _X: raw=${num} local=${local})
exten => _X.,7,Goto(out,1,1)

exten => _+X.,1,NoOp(Normalize destination: ${EXTEN})
exten => _+X.,2,Set(num=${FILTER(0-9,${EXTEN})})
exten => _+X.,3,Set(local=${num})
; Strip the leading + / 00 and Mexico country code for E.164 target.
exten => _+X.,4,ExecIf($[ "${SUBSTR(${num},1,2)}" = "52" & ${LEN(num)}>10 ]?Set(local=${num:2}))
exten => _+X.,5,ExecIf($[ "${SUBSTR(${local},1,1)}" = "1" & ${LEN(local)}=11 ]?Set(local=${local:1}))
exten => _+X.,6,NoOp(Normalized _+X: raw=${num} local=${local})
exten => _+X.,7,Goto(out,1,1)

; ---- Shared outbound router: pick trunk by TRUNK2_PREFIX ----
; If dest begins with TRUNK2_PREFIX (and TRUNK2_PREFIX is non-empty) the call
; goes to trunk-lan2; otherwise it stays on trunk-vos3000 (default = unchanged
; VOS3000 behaviour when TRUNK2_PREFIX is empty).
[out]
exten => _X.,1,NoOp(Routing ${EXTEN} — TRUNK2_PREFIX='__TRUNK2_PREFIX__')
exten => _X.,2,GotoIf($[ ${LEN(__TRUNK2_PREFIX__)}>0 & "${SUBSTR(${EXTEN},1,${LEN(__TRUNK2_PREFIX__)})}" = "__TRUNK2_PREFIX__" ]?out2,1:out1,1)

; ---- Outbound via trunk-vos3000 (LAN #1 / VOS3000) ----
[out1]
exten => _X.,1,Set(dest=__OUTBOUND_PREFIX__${EXTEN})
exten => _X.,2,Verbose(2,Dialing trunk-vos3000/${dest} (raw=${EXTEN}))
exten => _X.,3,MixMonitor(__RECORD_DIR__/phone-${CALLERID(num)}-${STRFTIME(${EPOCH},,%Y%m%d%H%M%S)}.wav)
exten => _X.,4,Dial(PJSIP/trunk-vos3000/sip:${dest}@__TRUNK_HOST__:__TRUNK_PORT__,60,g)
exten => _X.,5,Hangup(${HANGUPCAUSE})

; ---- Outbound via trunk-lan2 (LAN #2, enabled only when TRUNK2_HOST is set) ----
[out2]
exten => _X.,1,Set(dest=__TRUNK2_OUTBOUND_PREFIX__${EXTEN})
exten => _X.,2,Verbose(2,Dialing trunk-lan2/${dest} (raw=${EXTEN}))
exten => _X.,3,MixMonitor(__RECORD_DIR__/phone-${CALLERID(num)}-${STRFTIME(${EPOCH},,%Y%m%d%H%M%S)}.wav)
exten => _X.,4,Dial(PJSIP/trunk-lan2/sip:${dest}@__TRUNK2_HOST__:__TRUNK2_PORT__,60,g)
exten => _X.,5,Hangup(${HANGUPCAUSE})

; Inbound calls from the trunk. No DIDs are mapped yet, so answer with a
; brief Spanish prompt and end. Map real DIDs here when the provider issues them.
[from-trunk]
exten => _X.,1,NoOp(Inbound from trunk ${EXTEN})
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

