; Dialplan for the WebRTC softphone gateway.

[from-internal]
; Echo test / self check: dial 7777
exten => 7777,1,NoOp(Echo test for ${CALLERID(num)})
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; One-way playback test (Asterisk -> browser only, no mic/loop involved): 7778
exten => 7778,1,NoOp(Playback-only test for ${CALLERID(num)})
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()

; Anything else is an outbound call through the VOS3000 trunk.
exten => _X.,1,NoOp(Outbound ${CALLERID(num)} -> ${EXTEN})
 same => n,Goto(outbound,${EXTEN},1)

exten => _+X.,1,NoOp(Outbound E.164 ${CALLERID(num)} -> ${EXTEN})
 same => n,Goto(outbound,${EXTEN},1)

[outbound]
; Both plain digits and E.164 (+52...) targets go through normalization.
; Priority labels are explicit on every line: do NOT use shared "same => n,"
; continuations across the _X. / _+X. entries, or Asterisk attaches the whole
; chain to the LAST matching entry and the other pattern is left dangling
; (call hits that one, runs only priority 1 and fallthroughs without dialing).
exten => _X.,1,Goto(normalize,${EXTEN},1)
exten => _+X.,1,Goto(normalize,${EXTEN},1)

[normalize]
; Each of the two destination patterns (_X. plain digits, _+X. E.164) gets its
; OWN complete, explicitly-numbered chain.  Number 5526057993 (52 prefix, 10
; digits) matches _X. and must still run Set/FILTER/ExecIf/Dial.
exten => _X.,1,NoOp(Normalize destination: ${EXTEN})
exten => _X.,2,Set(num=${FILTER(0-9,${EXTEN})})
exten => _X.,3,Set(local=${num})
; If the number carries the Mexico country code (starts with 52 and is longer
; than the 10-digit national number), strip the leading 52. Contacts stored as
; E.164 (+52XXXXXXXXXX) arrive as 52XXXXXXXXXX -> XXXXXXXXXX.
exten => _X.,4,ExecIf($[ ${REGEX(^52,${num})} & ${LEN(num)}>10 ]?Set(local=${num:2}))
; Legacy mobile format used a leading 1 after the country code (+521XXXXXXXXXX):
; if an 11-digit number starting with 1 remains, drop that 1 as well.
exten => _X.,5,ExecIf($[ ${REGEX(^1,${local})} & ${LEN(local)}=11 ]?Set(local=${local:1}))
; Apply the provider dial prefix (e.g. 82152) configured at deploy time.
exten => _X.,6,Set(dest=__OUTBOUND_PREFIX__${local})
exten => _X.,7,Verbose(2,Dialing PJSIP/trunk-vos3000/${dest} (raw=${num} local=${local}))
exten => _X.,8,Dial(PJSIP/${dest}@trunk-vos3000,60,g)
exten => _X.,9,Hangup(${HANGUPCAUSE})

exten => _+X.,1,NoOp(Normalize destination: ${EXTEN})
exten => _+X.,2,Set(num=${FILTER(0-9,${EXTEN})})
exten => _+X.,3,Set(local=${num})
; Strip the leading + / 00 and Mexico country code for E.164 target.
exten => _+X.,4,ExecIf($[ ${REGEX(^52,${num})} & ${LEN(num)}>10 ]?Set(local=${num:2}))
exten => _+X.,5,ExecIf($[ ${REGEX(^1,${local})} & ${LEN(local)}=11 ]?Set(local=${local:1}))
exten => _+X.,6,Set(dest=__OUTBOUND_PREFIX__${local})
exten => _+X.,7,Verbose(2,Dialing PJSIP/trunk-vos3000/${dest} (raw=${num} local=${local}))
exten => _+X.,8,Dial(PJSIP/${dest}@trunk-vos3000,60,g)
exten => _+X.,9,Hangup(${HANGUPCAUSE})

; Inbound calls from the trunk. No DIDs are mapped yet, so answer with a
; brief Spanish prompt and end. Map real DIDs here when the provider issues them.
[from-trunk]
exten => _X.,1,NoOp(Inbound from trunk ${EXTEN})
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Predictive dialing (并发预拨) — dials N numbers at once through the trunk,
; the FIRST one to answer is bridged to the agent's WebRTC extension, the rest
; are hung up (and get released back to the queue by the platform).
;
; This context is NOT dialled by the softphone. Instead the backend (or the
; Asterisk CLI) `Originate`s each pre-dial leg here via AMI, passing the target
; number as a variable:
;   Channel:  PJSIP/trunk-vos3000                      (the trunk leg)
;   Exten:    s     Context: predictive  Priority: 1  (the dialplan entry)
;   Variable: PRED_DEST=<full number, e.g. 5217226452713>,
;             PRED_AGENT=<agent WebRTC ext, e.g. 1001>,
;             PRED_ID=<dial_campaign_numbers row id>
;
; When the customer answers, Asterisk routes the connected leg through
; [predictive]/s which Dials the customer over the trunk (the originate dial)
; and then bridges the winner to the agent's softphone. The backend's AMI
; listener detects the FIRST answer and hangs up the remaining legs with a
; Hangup action; the non-winners are released back to pending through the
; /api/dial/.../predictive/release REST call.
; ---------------------------------------------------------------------------
[predictive]
; s = single originating leg. Dest number comes from the PRED_DEST variable the
; platform passes at Originate time (never derived from the ambiguous CALLERID).
; After Dial returns on the originate leg, we hang up — the DIALSTATUS tells the
; backend (AMI listener) whether this leg answered; the winner is bridged to the
; agent and the rest are released back to the queue via /predictive/release.
exten => s,1,NoOp(Predictive leg: PRED_DEST=${PRED_DEST} agent=${PRED_AGENT} id=${PRED_ID})
 same => n,GotoIf($[${LEN(${PRED_DEST})}=0]?hangup)
 same => n,Set(dest=__OUTBOUND_PREFIX__${FILTER(0-9,${PRED_DEST})})
 same => n,Verbose(2,Predictive: dialing trunk/${dest}, bridge to ${PRED_AGENT} on answer)
 same => n,Dial(PJSIP/${dest}@trunk-vos3000,40,g)
 same => n,Hangup()
 same => n(hangup),Hangup()

; -- Winner handling (performed by the backend via AMI) ----------------------
; Each originate pre-dials its leg here. When the AMI listener (in the platform
; backend) observes the FIRST of the batch reaching DIALSTATUS=ANSWER, it:
;   1. Bridges that answered leg to the agent's WebRTC caller (PJSIP/<agent>),
;   2. Hangs up the remaining stale originate legs (Hangup AMI action),
;   3. Calls /api/dial/<cid>/predictive/release so the non-winners go back to
;      the pending pool for a later retry.
; The dialplan above only needs to deliver the call over the trunk and expose
; the DIALSTATUS; the winner selection lives in the backend (Python), which the
; sandbox cannot emulate without a real Asterisk + VOS3000 upstream.
