; Module loading for the softphone gateway.
;
; We use autoload so Asterisk resolves module dependencies against the modules
; actually present in the image. A hand-maintained load list breaks across
; Asterisk majors (e.g. app_setcallerid.so was removed in Asterisk 20; one bad
; name makes res_pjsip/chan_pjsip "decline to load" via dependency failure).
[modules]
autoload = yes

; Disable the LEGACY chan_sip channel driver. With both drivers loaded the
; WebSocket REGISTER was being consumed by chan_sip (which has no 1001 user
; configured) instead of res_pjsip, yielding 403 "Wrong password".
noload = chan_sip.so
