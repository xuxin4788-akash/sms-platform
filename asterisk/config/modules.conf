; Explicitly load the modules the softphone gateway needs. Keeping this tight
; avoids loading hardware/channel drivers that do not exist in the container.
; Module set verified against Debian bullseye asterisk-modules 16.28.
[modules]
autoload = no

; Core
load => app_dial.so
load => app_playback.so
load => app_echo.so
load => app_macro.so
load => app_setcallerid.so
load => app_stack.so
load => app_verbose.so
load => func_callerid.so
load => func_logic.so
load => func_strings.so
load => func_channel.so

; Media / RTP / WebRTC transport
load => res_rtp_asterisk.so
load => res_srtp.so
load => res_http_websocket.so
load => res_pjproject.so

; PJSIP stack + channel (all inside asterisk-modules on bullseye)
load => res_pjsip.so
load => res_pjsip_authenticator_digest.so
load => res_pjsip_caller_id.so
load => res_pjsip_outbound_authenticator_digest.so
load => res_pjsip_session.so
load => chan_pjsip.so

; Codecs / formats (G.711 is built into the core; list the file format loaders)
load => codec_resample.so
load => format_sln.so
load => format_wav.so
load => format_wav_gsm.so
load => format_gsm.so

load => pbx_config.so
