; Asterisk Manager Interface (AMI). Enables the SMS platform / backend to
; place OUTBOUND calls server-side (needed for predictive dialing) — this is
; the "server originates N calls, first answer is bridged to the agent" engine.
;
; Enable with AMI_ENABLED=1 and set AMI_USER / AMI_SECRET in .env (see
; entrypoint.sh). The app container (or the Asterisk CLI / a SIP peer) uses
; these credentials to `Originate` batch calls into the [predictive] context.

[general]
enabled = __AMI_ENABLED__
web_enabled = no
; Bind on all interfaces inside the docker network so the backend can reach it.
bindaddr = 0.0.0.0
port = 5038
; Only allow from our own containers / trusted nets. Tighten for production.
; permit = 172.16.0.0/12

[__AMI_USER__]
secret = __AMI_SECRET__
read = system,call,log,verbose,command,agent,user,config,command,dtmf
write = system,call,user,config,command,agent,originate
; The platform must be able to Originate + Bridge predictive legs.