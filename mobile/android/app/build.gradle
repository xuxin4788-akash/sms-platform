apply plugin: 'com.android.application'

// Release signing: read credentials from keystore.properties (not committed).
// Falls back to env vars (KEYSTORE_STORE_PASSWORD / KEYSTORE_KEY_PASSWORD) so CI
// can build without a properties file.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def releaseStoreFile = keystoreProps.getProperty('storeFile') ?: System.getenv('KEYSTORE_FILE')
def releaseStorePassword = keystoreProps.getProperty('storePassword') ?: System.getenv('KEYSTORE_STORE_PASSWORD')
def releaseKeyAlias = keystoreProps.getProperty('keyAlias') ?: System.getenv('KEYSTORE_ALIAS') ?: 'sms-marketing'
def releaseKeyPassword = keystoreProps.getProperty('keyPassword') ?: System.getenv('KEYSTORE_KEY_PASSWORD')

android {
    namespace "com.smsmarketing.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.smsmarketing.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            // Sign with the release key when keystore is configured; else build unsigned.
            signingConfig releaseStoreFile ? signingConfigs.release : null
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            resValue "string", "build_app_name", "SMS Marketing"
        }
        debug {
            // Sandbox build: distinct applicationId and label so the debug APK
            // can be installed alongside the production build on the same device.
            // Done via buildType (not productFlavors) because the bundled Capacitor
            // library subprojects do not declare custom flavor dimensions, which
            // would otherwise produce "No matching configuration" resolution errors.
            applicationIdSuffix ".sandbox"
            versionNameSuffix "-sandbox"
            resValue "string", "build_app_name", "SMS Marketing (Sandbox)"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
